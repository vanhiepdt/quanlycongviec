# nginx host cho office.ttdt.site (Phase 8 việc 5) — proxy về container OnlyOffice
# (127.0.0.1:8081, docker-compose.yml). Bật SAU khi:
#   1) DNS A office.ttdt.site -> 157.10.199.148 (người dùng làm)
#   2) certbot --nginx -d office.ttdt.site (cert riêng, không chung với ttdt.site)
# Cần kèm deploy/nginx/websocket-map.conf (map $connection_upgrade) vì editor dùng
# WebSocket — xem chú thích trong tệp đó.
#
# Sao chép khi triển khai:
#   /opt/qlcv/deploy/nginx/office.ttdt.site.conf -> /etc/nginx/sites-available/office.ttdt.site
#   ln -s ... /etc/nginx/sites-enabled/ ; nginx -t ; reload

server {
    listen 80;
    listen [::]:80;
    server_name office.ttdt.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://office.ttdt.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.ttdt.site;

    ssl_certificate     /etc/letsencrypt/live/office.ttdt.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.ttdt.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS-office:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: ttdt.site đã khai includeSubDomains nên miền con đã được che; khai thêm
    # ở đây cho chắc nếu sau này tách miền.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Tài liệu có thể lớn (video/PDF nặng) — DS tự giới hạn theo cấu hình của nó.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        # WebSocket của editor: không có hai dòng này thì khung soạn thảo đứng ở "Connecting".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Phiên sửa tài liệu sống lâu hơn 60 giây mặc định rất nhiều.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
