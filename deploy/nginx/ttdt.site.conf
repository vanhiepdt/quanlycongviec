# Nginx chạy TRÊN HOST của VPS (Phase 8 việc 4) — KHÁC app.conf (bản nginx trong
# container thời Vòng 14, dùng resolver Docker). Sao chép khi triển khai:
#   /opt/qlcv/deploy/nginx/ttdt.site.conf        -> /etc/nginx/sites-available/ttdt.site
#   /opt/qlcv/deploy/nginx/security-headers.conf -> /etc/nginx/snippets/security-headers.conf
# rồi `ln -s /etc/nginx/sites-available/ttdt.site /etc/nginx/sites-enabled/` và XOÁ
# `default` khỏi sites-enabled (khối 80 default_server ở đây thay nó).
#
# HTTPS dùng cert đã cấp sẵn ở /etc/letsencrypt/live/ttdt.site (đừng xin lại).
# office.ttdt.site có khối riêng (việc 5, bật sau khi DNS trỏ về).

# ---- 80: mọi tên miền đều về https://ttdt.site (www -> apex, http -> https) ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ttdt.site www.ttdt.site;

    # Cho certbot gia hạn (thư mục webroot chuẩn).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ttdt.site$request_uri;
    }
}

# ---- 443: trang chính --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ttdt.site;

    ssl_certificate     /etc/letsencrypt/live/ttdt.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttdt.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTPS đã ổn định từ trước Phase 8 nên bật HSTS ngay (Phase 8 việc 4).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/qlcv/web;
    index index.html;

    charset utf-8;
    client_max_body_size 60m;  # tệp đính kèm nhiệm vụ tối đa 20 MB, chừa dư địa (§7 việc 4)
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               font/woff2 application/manifest+json;

    # ---- API: đẩy sang container app -----------------------------------------
    # App buộc 127.0.0.1:3000 (docker-compose.yml) nên ghi thẳng địa chỉ, khỏi
    # resolver/biến upstream — IP literal không cần phân giải DNS lúc khởi động.
    # X-Forwarded-*: app.js đặt `trust proxy` 1; thiếu là giới hạn tần suất và
    # nhật ký đếm chung IP 127.0.0.1 cho cả thiên hạ.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Đầu bảo mật của /api do helmet trong Express đặt — KHÔNG add_header thêm.
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:3000/readyz;
        access_log off;
    }

    # ---- Tài nguyên tĩnh: cache 30 ngày ---------------------------------------
    # An toàn vì index.html KHÔNG cache và gọi tệp kèm `?v=...` — bump `?v=` là có bản mới.
    # KHÔNG có `always`: đặt max-age cho cả 404 thì trình duyệt nhớ "tệp không tồn tại" 30 ngày.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # ---- index.html: KHÔNG cache (chứa danh sách <script src>) ----------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Ứng dụng một trang: F5 giữa app không ra 404.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
