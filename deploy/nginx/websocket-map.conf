# Đặt ở /etc/nginx/conf.d/websocket-map.conf — khối `map` phải nằm trong ngữ cảnh http,
# và conf.d/*.conf được nginx.conf include ở đúng chỗ đó. Dùng chung cho mọi site có
# WebSocket (hiện chỉ office.ttdt.site — Phase 8 việc 5).
#
# Vì sao cần map thay vì ghi thẳng `proxy_set_header Connection "upgrade"`: header
# Connection phải là "upgrade" CHỈ khi client gửi Upgrade (WebSocket); request thường
# mà bị nối Connection: upgrade là phía sau xử lý sai. $http_upgrade rỗng thì biến này
# ra "close", có Upgrade thì ra "upgrade".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
