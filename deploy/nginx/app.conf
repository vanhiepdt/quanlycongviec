# Nginx cho bản VPS — việc 4.8: phục vụ web/ tĩnh, cache assets/ 30 ngày, index.html không cache.
#
# Phạm vi: chỉ khối HTTP. TLS + Let's Encrypt + gzip đầy đủ + timeout là việc §8.3 (Phase 8);
# ở đây đủ để chạy thật sau `docker compose up` và để `nginx -t` sạch.
#
# `include` chứ không lặp lại: xem lý do trong security-headers.conf (add_header không cộng dồn).
#
# Ba chỗ gắn tệp mà container nginx cần (§8.2 sẽ viết vào docker-compose.yml):
#   web/                               -> /srv/web                                  (chỉ đọc)
#   deploy/nginx/app.conf              -> /etc/nginx/conf.d/app.conf                (chỉ đọc)
#   deploy/nginx/security-headers.conf -> /etc/nginx/snippets/security-headers.conf  (chỉ đọc)
#
# Kiểm cú pháp mà không cần cài nginx trên máy:
#   docker run --rm -v "$PWD/deploy/nginx/app.conf:/etc/nginx/conf.d/app.conf:ro" \
#     -v "$PWD/deploy/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
#     nginx:1.27-alpine nginx -t

server {
    # `default_server`: ảnh nginx chính thức có sẵn /etc/nginx/conf.d/default.conf phục vụ trang
    # "Welcome to nginx" từ /usr/share/nginx/html. Khối nào khai báo `default_server` thì khối đó
    # nhận mọi yêu cầu không khớp server_name — không có từ này thì default.conf thắng, và trang
    # trả về 200 với nội dung của nginx kèm 404 cho mọi tệp trong assets/. Đã gặp thật khi thử.
    # §8.2 vẫn nên xoá default.conf trong ảnh, nhưng dòng này khiến quên cũng không sai.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Thư mục web/ của repo, gắn vào container nginx dạng chỉ đọc (§8.2).
    root /srv/web;
    index index.html;

    charset utf-8;
    client_max_body_size 10m; # §8.3 — tệp .xlsx nhập vào
    server_tokens off;        # không nói phiên bản nginx cho người lạ

    # Tên `app` là tên service trong deploy/docker-compose.yml (§8.2). Cố ý KHÔNG dùng khối
    # `upstream`: nginx phân giải tên trong `upstream` NGAY LÚC KHỞI ĐỘNG, nên nếu container `app`
    # chưa lên thì nginx chết luôn với "host not found in upstream" và quay vòng khởi động lại —
    # cả trang trắng chỉ vì máy chủ ứng dụng chậm 2 giây. Để tên trong một biến thì nginx hỏi DNS
    # nội bộ của Docker (127.0.0.11) lúc có yêu cầu: `app` chết thì trả 502, không sập theo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream "app:3000";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               font/woff2 application/manifest+json;

    # ---- API: đẩy sang Node -------------------------------------------------
    # X-Forwarded-*: app.js đặt `trust proxy` 1 nên IP thật lấy từ đây. Thiếu là giới hạn tần suất
    # đăng nhập đếm chung IP của nginx cho cả thiên hạ, và nhật ký ghi sai người.
    location /api/ {
        # $request_uri phải viết rõ: khi proxy_pass có biến, nginx KHÔNG tự nối đường dẫn vào.
        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Không add_header ở đây: đầu của /api do helmet trong Express đặt, thêm nữa là trùng đôi.
    }

    location = /healthz {
        proxy_pass http://$app_upstream/healthz;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://$app_upstream/readyz;
        access_log off;
    }

    # ---- Tài nguyên tĩnh: cache 30 ngày -------------------------------------
    # 30 ngày là an toàn khi tên tệp có dấu vết phiên bản. Thư viện trong vendor/ nằm trong thư mục
    # theo phiên bản; app.css / app.js / api-bridge.js được index.html gọi kèm `?v=...`, mà
    # index.html thì KHÔNG cache — nên sửa xong bump `?v=` là người dùng nhận bản mới ngay.
    # BẪY: quên bump `?v=` là người đang dùng giữ bản cũ tới 30 ngày mà không hiểu vì sao.
    # Phase 8 phải sinh `?v=` tự động từ mã commit lúc dựng ảnh (§13.4).
    location /assets/ {
        # KHÔNG có `always` ở đây, cố ý: `always` đặt đầu cho cả phản hồi lỗi, nên một đường dẫn
        # sai chính tả trả 404 kèm max-age=2592000 và trình duyệt nhớ "tệp này không tồn tại" suốt
        # 30 ngày — thêm tệp vào đúng chỗ đó sau cũng vẫn 404 với người đã ghé. Không có `always`
        # thì nginx chỉ đặt cho 200/204/301/302/304. Đầu bảo vệ thì ngược lại: phải `always`.
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404; # thiếu tệp thì 404 thật, không được rơi về index.html
    }

    # ---- index.html: KHÔNG cache -------------------------------------------
    # Trang chứa danh sách <script src> — cache nó là khoá luôn cả bản JS cũ.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả về index.html để F5 giữa app không ra 404.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
