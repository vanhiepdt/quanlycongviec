# Đầu bảo vệ dùng chung cho MỌI location — việc 4.8.
#
# Vì sao phải là một tệp include chứ không viết một lần ở khối server: `add_header` của nginx KHÔNG
# cộng dồn theo cấp. Hễ một `location` có `add_header` riêng (ở đây là `Cache-Control`) thì nó BỎ
# HẾT các `add_header` của cấp trên. Viết ở khối server rồi tưởng cả trang được bảo vệ là sai —
# đúng những location có cache lại là những location mất sạch đầu bảo vệ.
#
# Tệp tĩnh do nginx trả nên KHÔNG đi qua helmet của Express: mọi thứ dưới đây là phần helmet lo cho
# /api, còn phần này lo cho index.html và assets/.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP: `default-src 'self'` là điều 4.3 đã dựng được (không còn CDN nào). Ba chỗ nới lỏng, mỗi chỗ
# một lý do thật — KHÔNG siết thêm trước khi bỏ được nguyên nhân, siết bừa là trang trắng:
#
#   script-src 'unsafe-inline'  app.js dựng hàng trăm nút onclick="..." (§7 việc 4.6). Bỏ được
#                               'unsafe-inline' chỉ sau khi chuyển hết sang addEventListener.
#   script-src 'unsafe-eval'    Alpine.js đánh giá biểu thức x-* bằng new Function.
#   frame-src https:            modal "ứng dụng" nhúng iframe theo địa chỉ người dùng tự nhập —
#                               siết về 'self' là mất tính năng, không phải mất lỗ hổng.
#   img-src data: https:        ảnh biểu tượng ứng dụng do người dùng dán vào.
#
# Không có 'unsafe-inline' cho `style-src` là không được: Tailwind + mã cũ đặt style trực tiếp.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
